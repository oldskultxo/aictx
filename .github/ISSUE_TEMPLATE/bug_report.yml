name: Bug report
description: Report a reproducible problem in AICTX
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough detail for someone else to reproduce it.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
      placeholder: Describe the bug clearly and concisely.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact commands or actions that trigger the problem.
      placeholder: |
        1. Run `...`
        2. Open `...`
        3. See error `...`
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include logs or tracebacks if relevant.
      render: text
    validations:
      required: true

  - type: input
    id: aictx-version
    attributes:
      label: AICTX version
      description: Output of `aictx --version`, package version, or commit SHA.
      placeholder: "6.3.0"
    validations:
      required: false

  - type: dropdown
    id: runner
    attributes:
      label: Agent/runtime
      description: Where did you encounter the issue?
      options:
        - Codex
        - Claude
        - Generic agent
        - CLI only
        - Other
    validations:
      required: false

  - type: input
    id: python-version
    attributes:
      label: Python version
      description: Output of `python --version`.
      placeholder: "Python 3.11.x"
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, shell, install method, virtualenv details, and any relevant repo setup.
      placeholder: "macOS / zsh / pipx / .venv / ..."
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Anything else that may help debug this issue.
    validations:
      required: false
